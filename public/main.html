<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIIDRO ICT Company Summit — Main Screen</title>
<link rel="stylesheet" href="style.css">
<style>
  #fx { position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; }
  .layout { position: relative; z-index: 3; min-height: 100vh; display: flex; }

  /* INTERLUDIO — un solo #iReadout: titolo persistente in alto a riposo, che al
     cambio esempio cresce al centro (wheel) e torna titolo. Senza più date da
     percorrere: la wheel mostra occhiello + titolo dell'esempio. */
  #iBg { position: fixed; inset: 0; z-index: 5; opacity: 0; pointer-events: none;
    background-color: var(--bg);
    background-image: radial-gradient(ellipse at 50% 42%, var(--accent-a) 0%, transparent 55%), url("circuit.svg"),
                      radial-gradient(ellipse at 50% 42%, var(--bg-a) 0%, var(--bg-deep) 100%);
    background-size: 120% 80%, 320px 320px, cover; background-repeat: no-repeat, repeat, no-repeat; }
  /* Dimensioni qui = stato WHEEL (grande): il render nativo è a piena risoluzione,
     così la wheel (scale 1) è nitida; il titolo è lo stesso elemento RIMPICCIOLITO
     (downscale → resta nitido). Scalare in su un render piccolo, invece, sgrana. */
  #iReadout { position: fixed; top: 14px; left: 0; right: 0; z-index: 7; text-align: center; opacity: 0; pointer-events: none;
    transform-origin: 50% 50%; will-change: transform, opacity; padding: 0 4vw; }
  #iOcchiello { font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.2em; color: var(--accent); font-size: clamp(2rem, 3.6vw, 2.8rem); margin-bottom: 0.5em; }
  #iTitolo { font-family: var(--font-display); font-weight: 800; color: var(--white);
    line-height: 0.98; letter-spacing: 0.01em; font-size: clamp(4.2rem, 9vw, 7.4rem); text-transform: uppercase; }

  /* Colonna singola (§5.1): senza Indice e senza esiti non resta niente da
     mettere a lato, e i quattro poli di voto hanno bisogno di tutta la larghezza. */
  main { flex: 1; padding: var(--sp-xl); max-width: 1500px; margin: 0 auto; width: 100%; }

  /* lobby */
  #lobby { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--sp-md); }
  #qr { width: min(42vh, 360px); height: min(42vh, 360px); border-radius: 16px; border: 1px solid var(--wire); background: #fff; padding: 14px; }
  .count { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem,6vw,4rem); color: var(--accent); }

  /* POLI DI VOTO — da 2 a 4, generati da JS. Il colore arriva per indice
     (--pole-1..4) su --c: una variabile sola, niente classi per opzione. */
  .poles { display: grid; gap: var(--sp-md); margin-top: var(--sp-lg);
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 20em), 1fr)); }
  .pole { border: 1px solid var(--wire); border-color: var(--c); border-radius: 16px; padding: var(--sp-md);
    min-height: 30vh; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
  .pole.win { box-shadow: 0 0 0 2px currentColor inset; color: var(--c); }
  .pole .opt { font-family: var(--font-text); font-size: clamp(1rem,1.6vw,1.4rem); color: var(--white); }
  /* "Cosa guadagni / Cosa paghi" invece di una tabella pro-contro: mette la sala
     davanti al dilemma senza far sembrare ovvia la risposta giusta */
  .pole .gain, .pole .cost { font-size: 0.95rem; color: var(--muted); margin-top: 0.9em; }
  .pole .gain b, .pole .cost b { display: block; font-family: var(--font-display); font-weight: 700;
    font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.25em; color: var(--c); }
  .pole .n { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.5rem,7vw,5rem); font-variant-numeric: tabular-nums; min-width: 0; }
  /* con tre o quattro opzioni lo spazio si stringe: i testi rientrano */
  .poles.stretta .pole { min-height: 24vh; padding: var(--sp-sm) var(--sp-md); }
  .poles.stretta .opt { font-size: clamp(0.95rem,1.25vw,1.15rem); }
  .poles.stretta .gain, .poles.stretta .cost { font-size: 0.85rem; margin-top: 0.6em; }
  .poles.stretta .n { font-size: clamp(2rem,4vw,3.2rem); }
  /* timer del voto: una barra che si svuota, senza cifre — un numero che scende
     mette fretta, una barra dà il tempo che resta senza contarlo */
  .votebar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: var(--sp-sm); }
  .votebar > i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left center; }
  #voteCount { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; font-size: 0.95rem; color: var(--muted); margin-top: var(--sp-sm); }
  #voteCount b { font-size: 2.2rem; color: var(--accent); letter-spacing: 0; vertical-align: -0.15em; }
  /* dice che il silenzio è voluto, non un guasto */
  #voteCount .pill { display: inline-block; margin-left: 0.8em; padding: 0.35em 0.9em; font-size: 0.7rem;
    border: 1px solid var(--wire); border-radius: 999px; letter-spacing: 0.1em; }

  /* rivelazione: la forbice completa si vede sempre qui, anche dove il live era spento */
  .revtally { display: flex; flex-wrap: wrap; gap: var(--sp-md); margin: var(--sp-md) 0; }
  .revtally .voce { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums;
    font-size: clamp(1.4rem,3vw,2.4rem); color: var(--c); }
  .revtally .voce small { display: block; font-family: var(--font-text); font-weight: 400;
    font-size: 0.8rem; letter-spacing: 0; text-transform: none; color: var(--muted); max-width: 14em; }
  #revChiusura { border-left: 3px solid var(--accent); padding: 0.4em 0 0.4em 1em; margin-top: var(--sp-lg);
    font-size: clamp(1rem,1.6vw,1.3rem); }
  /* CHAT — flusso di dati che sale nella banda bassa. Serve al narratore per
     pescare gli interventi: conta che si veda arrivare, non che si legga come
     un documento. Tre corsie, così tre messaggi insieme non si coprono. */
  #chat { position: fixed; left: 0; right: 0; bottom: 0; height: 40vh; z-index: 4;
    pointer-events: none; overflow: hidden; }
  .bolla { position: absolute; bottom: 0; width: 28%; padding: 0.5em 0.8em 0.5em 1em;
    background: linear-gradient(90deg, rgba(28,28,28,0.92), rgba(28,28,28,0.55) 80%, transparent);
    border-left: 2px solid var(--accent); border-radius: 0 10px 10px 0;
    font-family: var(--font-mono); font-size: clamp(0.95rem, 1.25vw, 1.25rem); line-height: 1.4;
    color: var(--white); text-shadow: 0 2px 12px rgba(0,0,0,0.85); will-change: transform, opacity; }
  .bolla.c0 { left: 3vw; } .bolla.c1 { left: 36vw; } .bolla.c2 { left: 69vw; }
  .bolla .chi { font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 0.62em; color: var(--accent); display: block; margin-bottom: 0.2em; }
  /* il cursore dice che il messaggio sta ancora "arrivando" */
  .bolla .txt::after { content: "_"; color: var(--accent); animation: caret 0.9s steps(1) infinite; }
  .bolla.finita .txt::after { content: none; }
  @keyframes caret { 50% { opacity: 0; } }
  body.conchat #game main { padding-bottom: 32vh; }
  .beat { margin: 1em 0; }
  .agg { display: flex; justify-content: space-between; border-bottom: 1px solid var(--wire); padding: 0.4em 0; font-size: 0.9rem; }
  .agg b { color: var(--accent); }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="chat"></div>

<!-- INTERLUDIO — sfondo (solo durante il cambio) e il readout, unico elemento:
     titolo in alto a riposo, wheel al centro in azione -->
<div id="iBg"></div>
<div id="iReadout">
  <div id="iOcchiello"></div>
  <div id="iTitolo"></div>
</div>

<!-- LOBBY -->
<div id="lobby" class="wrap">
  <div class="year">SIIDRO 2026 · Lucca</div>
  <h1 class="hero">SIIDRO ICT<br>Company Summit</h1>
  <p class="muted">Un tavolo, non un palco. Inquadra il codice per entrare.</p>
  <img id="qr" alt="QR di accesso">
  <div><span class="count" id="lobbyCount">0</span> <span class="muted">al tavolo</span></div>
</div>

<!-- GIOCO — colonna singola (§5.1). Il titolo dell'esempio sta nel readout in
     alto (l'interludio lo lascia lì a riposo): qui sotto solo il corpo. -->
<div id="game" class="layout wrap hidden">
  <main id="col">
    <div id="chBody"></div>

    <div id="voteArea" class="hidden">
      <h2 id="voteQ" style="font-size:clamp(1.5rem,3vw,2.4rem)"></h2>
      <div class="votebar"><i id="voteFill"></i></div>
      <!-- a live spento è qui che la sala vede che si sta votando, senza sapere da che parte -->
      <div class="muted" id="voteCount"></div>
      <div class="poles" id="poles"></div>
    </div>

    <!-- RIVELAZIONE — dopo la chiusura del voto: cosa ha scelto la sala,
         la forbice completa, il costo nascosto di quello che ha vinto -->
    <div id="revealArea" class="hidden">
      <div class="year">La sala ha scelto</div>
      <h2 id="revChoice" style="font-size:clamp(1.4rem,2.6vw,2.2rem)"></h2>
      <div class="revtally" id="revTally"></div>
      <p class="muted" id="revCosto"></p>
      <p id="revChiusura"></p>
    </div>
  </main>
</div>

<!-- FINALE — niente scenario da comporre: resta l'elenco degli esempi con
     quello che ha scelto la sala (§5.2). Il finale personale sta sul telefono. -->
<div id="ended" class="layout wrap hidden">
  <main>
    <div class="year">SIIDRO ICT Company Summit</div>
    <h2>Cosa ha scelto il tavolo</h2>
    <div id="aggregates" style="margin-top:var(--sp-md)"></div>
    <p class="muted" style="margin-top:var(--sp-lg)">Sul telefono trovate le vostre risposte, accanto a quelle del tavolo.</p>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="esc.js"></script>
<script src="/vendor/gsap/gsap.min.js"></script>
<script src="main.js"></script>
</body>
</html>
