<!doctype html>
<meta charset="utf-8">
<title>SIIDRO ICT Company Summit</title>
<script>
  // router minimale: ?role= decide la superficie. default = device (il QR punta qui)
  // landing di default = MAIN (proiettore). I device arrivano via QR con ?role=device
  const role = new URLSearchParams(location.search).get("role") || "main";
  const page = role === "device" ? "device.html" : role === "director" ? "director.html" : "main.html";
  location.replace(page + location.search); // preserva ?k= (token regia) e altri param
</script>
