    <path d="M0 232 H60 l28 -28 H200 l24 24 H320"/>
    <path d="M60 0 V96 l28 28 V320"/>
    <path d="M236 0 V140 l-28 28 V320"/>
    <path d="M160 320 V196 l36 -36 V0"/>
  </g>
  <g fill="none" stroke="#F0EBE1" stroke-opacity="0.05" stroke-width="1.4">
    <path d="M0 148 H92"/>
    <path d="M272 0 V72 l-36 36"/>
    <path d="M320 276 H208 l-24 -24"/>
  </g>
  <g fill="#4391FF" fill-opacity="0.16">
